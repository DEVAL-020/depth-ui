<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />

    <!-- Primary SEO Meta Tags -->
    <title>
      Depth UI — The Foundation for your Design System | React &amp; Tailwind UI
      Library
    </title>
    <meta
      name="title"
      content="Depth UI — The Foundation for your Design System | React &amp; Tailwind UI Library"
    />
    <meta
      name="description"
      content="Build stunning web interfaces faster with 100+ accessible, reusable React and Tailwind CSS components. Create consistent designs with smooth animations, modern effects, and developer-friendly components."
    />
    <meta
      name="keywords"
      content="Depth UI, React components, UI library, design system, Tailwind CSS, TypeScript, 3D UI, WebGL, open source, Deval Patel, front-end developer, modern UI, dark mode components, accessible UI primitives"
    />
    <meta name="author" content="Deval Patel" />
    <meta name="creator" content="Deval Patel" />
    <meta name="publisher" content="Deval Patel" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <link rel="canonical" href="https://depth-ui.netlify.app/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://depth-ui.netlify.app/" />
    <meta property="og:site_name" content="Depth UI" />
    <meta
      property="og:title"
      content="Depth UI — The Foundation for your Design System"
    />
    <meta
      property="og:description"
      content="Build stunning web interfaces faster with 107+ accessible, reusable React &amp; Tailwind CSS primitives, 3D spatial visuals, fluid animations, and copy-paste CLI code."
    />
    <!-- WhatsApp, Facebook, LinkedIn, Discord & Social Crawlers require raster PNG/JPEG images -->
    <meta
      property="og:image"
      content="https://depth-ui.netlify.app/og-image.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://depth-ui.netlify.app/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Depth UI — 107+ Production React &amp; Tailwind UI Components"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://depth-ui.netlify.app/" />
    <meta
      name="twitter:title"
      content="Depth UI — The Foundation for your Design System"
    />
    <meta
      name="twitter:description"
      content="Build stunning web interfaces faster with 107+ accessible, reusable React &amp; Tailwind CSS primitives, 3D spatial visuals, fluid animations, and copy-paste CLI code."
    />
    <meta
      name="twitter:image"
      content="https://depth-ui.netlify.app/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="Depth UI — 107+ Production React &amp; Tailwind UI Components"
    />
    <meta name="twitter:creator" content="@DEVAL-020" />

    <!-- Mobile & PWA Configuration -->
    <meta name="application-name" content="Depth UI" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Depth UI" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Performance: DNS-Prefetch & Preconnect for External Resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://api.github.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://depth-ui.netlify.app/#website",
            "url": "https://depth-ui.netlify.app/",
            "name": "Depth UI",
            "description": "High-performance, accessible React component library and design system with 107+ interactive UI primitives.",
            "publisher": {
              "@id": "https://depth-ui.netlify.app/#author"
            },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://depth-ui.netlify.app/?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://depth-ui.netlify.app/#software",
            "name": "Depth UI",
            "operatingSystem": "Web Browser",
            "applicationCategory": "DeveloperApplication",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "author": {
              "@id": "https://depth-ui.netlify.app/#author"
            },
            "description": "Build stunning web interfaces faster with 100+ accessible, reusable React and Tailwind CSS components. Create consistent designs with smooth animations, modern effects, and developer-friendly components."
          },
          {
            "@type": "Person",
            "@id": "https://depth-ui.netlify.app/#author",
            "name": "Deval Patel",
            "url": "https://github.com/DEVAL-020",
            "sameAs": [
              "https://github.com/DEVAL-020",
              "https://www.linkedin.com/in/gecgce2024deval"
            ],
            "jobTitle": "Front-End Developer & Open Source Creator"
          }
        ]
      }
    </script>
  </head>

  <body
    class="bg-[#09090b] text-[#fafafa] antialiased selection:bg-zinc-800 selection:text-white min-h-screen overflow-x-hidden"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
